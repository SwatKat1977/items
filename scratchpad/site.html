<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Site Settings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <style>
        /* General Reset */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background-color: #eaf1f7;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background-color: #d2e1ed;
            min-height: 100vh;
            padding: 20px;
            position: fixed;
            top: 0;
            left: 0;
            overflow-y: auto;
            transition: width 0.3s ease;
        }

        /* Main Content */
        .content {
            margin-left: 250px;
            padding: 20px;
            flex-grow: 1;
            overflow-x: hidden;
            overflow-y: auto;
            transition: margin-left 0.3s ease;
        }

        /* Nav Tabs */
        .nav-tabs {
            display: flex;
            flex-wrap: nowrap;
            overflow: hidden; /* Hide the scroll bar */
            white-space: nowrap;
            border-bottom: 2px solid #dee2e6;
        }

        .nav-tabs .nav-item {
            flex: 1;
            text-align: center;
        }

        /* Remove background color from active tab */
        .nav-tabs .nav-item.show .nav-link,
        .nav-tabs .nav-link.active {
            background-color: transparent !important; /* Remove white background */
            font-weight: bold; /* Make text bold */
            border-color: transparent; /* Remove border if needed */
        }

        .settings-container {
            border: 0.5px solid black;
            padding: 15px;
            /* background-color: white; */
            border-radius: 4px; /* Optional: adds rounded corners */
        }

        /* Responsive Sidebar */
        @media (max-width: 1024px) {
            .sidebar {
                width: 200px; /* Smaller width on mid-sized screens */
            }
            .content {
                margin-left: 200px; /* Adjust content space */
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 150px; /* Even smaller on tablets and smaller screens */
                padding: 10px 5px; /* Reduce padding on smaller screens */

            }
            .content {
                margin-left: 150px; /* Adjust content space */
            }

            .sidebar h4 {
        font-size: 1rem; /* Make title smaller */
        margin-left: 0; /* Remove any extra margin on the left */
    }

    .sidebar .nav-link {
        font-size: 0.8rem; /* Smaller text for the links */
        padding-left: 5px; /* Reduces left padding */
        padding-right: 5px; /* Reduces right padding */
        text-align: left; /* Align text to the left */
    }
        }

        @media (max-width: 576px) {
            .sidebar {
                width: 100px; /* Full width on very small screens */
                font-size: 1rem; /* Adjust this value as necessary */
            }
            .content {
                margin-left: 100px;
                padding: 10px;
                width: 100%;
            }
        }

        /* Adjust the 'Manage Settings' heading font size for smaller screens */
        @media (max-width: 768px) {
            .sidebar h4 {
                font-size: 1.2rem;
            }
        }

    </style>
</head>
<body>

<div class="container-fluid d-flex">
    <!-- Sidebar -->
    <nav class="sidebar d-flex flex-column">
        <h4 class="fw-bold">Manage Settings</h4>
        <a href="#" class="nav-link text-dark">Overview</a>
        <a href="#" class="nav-link text-dark">Projects</a>
        <a href="#" class="nav-link text-dark">Users & Roles</a>
        <a href="#" class="nav-link text-dark">Customizations</a>
        <a href="#" class="nav-link text-dark">Integration</a>
        <a href="#" class="nav-link text-dark">Data Management</a>
        <a href="#" class="nav-link text-dark fw-bold">Site Settings</a>
    </nav>

    <!-- Main Content -->
    <main class="content">
        <h2>Site Settings</h2>

        <!-- Fix for Tabs Wrapping -->
        <ul class="nav nav-tabs flex-nowrap">
            <li class="nav-item">
                <a class="nav-link active" href="#">
                    <i class="bi bi-gear d-md-none"></i> 
                    <span class="d-none d-md-inline">Application</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">
                    <i class="bi bi-envelope d-md-none"></i> 
                    <span class="d-none d-md-inline">Email</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">
                    <i class="bi bi-person-lock d-md-none"></i> 
                    <span class="d-none d-md-inline">Login</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">
                    <i class="bi bi-shield-lock d-md-none"></i> 
                    <span class="d-none d-md-inline">Security</span>
                </a>
            </li>
        </ul>

        <!-- Settings Form -->
        <div class="mt-4">
            <div class="settings-container">
                <form>
                    <div class="mb-3">
                        <label for="installationName" class="form-label">Installation Name *</label>
                        <input type="text" class="form-control" id="installationName" value="TestRail QA">
                    </div>
                    <div class="mb-3">
                        <label for="defaultLanguage" class="form-label">Default Language *</label>
                        <select class="form-select" id="defaultLanguage">
                            <option selected>English</option>
                            <option>Spanish</option>
                            <option>French</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="defaultLocale" class="form-label">Default Locale *</label>
                        <select class="form-select" id="defaultLocale">
                            <option selected>English (United States)</option>
                            <option>English (United Kingdom)</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="defaultTimeZone" class="form-label">Default Time Zone *</label>
                        <select class="form-select" id="defaultTimeZone">
                            <option selected>(UTC-09:00) Alaska</option>
                            <option>(UTC-05:00) Eastern Time (US & Canada)</option>
                        </select>
                    </div>
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="enableAttachment">
                        <label class="form-check-label" for="enableAttachment">Enable attachment sharing</label>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
