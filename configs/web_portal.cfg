[logging]
log_level=INFO

[apis]
gateway_svc=http://gateway_svc:7050/

# HTTPS is optional here. Leave this section out to serve plain HTTP, e.g.
# during development without Docker.
#
# [tls]
# Serve HTTPS from the Portal itself (both files must be set together):
# cert_file=/path/to/cert.pem
# key_file=/path/to/key.pem
#
# Or, when a reverse proxy (e.g. Caddy) terminates HTTPS in front of the
# Portal, just mark the login cookies Secure:
# secure_cookies=true
