[logging]
log_level=INFO

[apis]
gateway_svc=http://gateway_svc:7050/

# In Docker, https_proxy (Caddy) terminates HTTPS in front of the Portal, so
# the login cookies must be marked Secure.
[tls]
secure_cookies=true

# Running the Portal without Docker? Delete the [tls] section above for plain
# HTTP (e.g. development), or have the Portal serve HTTPS itself:
# [tls]
# cert_file=/path/to/cert.pem
# key_file=/path/to/key.pem
