[pytest]
# Run from this folder, or point at it: pytest -c automation/pytest.ini automation
pythonpath = .
testpaths = tests

# Tests and fixtures may be 'async def' without marking each one. They all share
# one event loop, so one HTTP session can live for the whole run.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

# 'stack' tests need a running ITEMS stack, so they are left out unless asked
# for:  pytest -m stack
addopts = -ra --strict-markers -m "not stack"
markers =
    stack: needs a running ITEMS stack (Gateway, CMS and Identity)
