name: "🎉 Feature Request"
description: "Suggest a new feature or enhancement."
title: "[Feature] "
labels: ["Enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: "Problem / Motivation"
      description: "What problem does this feature solve? What are you trying to do that isn't currently possible?"
      placeholder: "Describe the problem or motivation behind this request."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: "Proposed Solution"
      description: "Describe the feature you would like to see implemented."
      placeholder: "Describe your proposed solution."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives Considered"
      description: "Have you considered any alternative approaches or workarounds?"
      placeholder: "Describe any alternatives you have considered."
  - type: checkboxes
    id: flags
    attributes:
      label: "Additional context"
      options:
        - label: "This is an RFC (Request for Comments) — a major change requiring discussion"
        - label: "This may introduce a backwards compatibility break"
